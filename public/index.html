<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot AI</title>
</head>
<body>
    <div class="app">
        <!-- Komponen akan ditambahkan bertahap -->
    </div>

    <script src="script.js"></script>
</body>
</html>
<link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
<header class="topbar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>Chatbot AI</h1>
                    <span class="status-text" id="statusText">OpenRouterAPI</span>
                </div>
            </div>

            <div class="topbar-actions">
                <button
                    type="button"
                    class="icon-btn"
                    id="themeToggle"
                    aria-label="Ganti tema tampilan"
                    title="Ganti tema (Terang / Gelap)"
                >
                    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
                    </svg>
                    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
                    </svg>
                </button>

                <button
                    type="button"
                    class="btn-secondary"
                    id="newChatBtn"
                    title="Mulai percakapan baru"
                >
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                    <span>Chat Baru</span>
                </button>
            </div>
        </header>

        <main class="chat-main" id="chatContainer" aria-live="polite">
            <section class="empty-state" id="emptyState">
                <div class="empty-badge">Asisten Virtual</div>
                <h2>Ada yang bisa dibantu hari ini?</h2>
                <p>Ajukan pertanyaan, minta bantuan kode, atau diskusikan topik apa saja.</p>

                <div class="prompt-suggestions" aria-label="Contoh pertanyaan">
                    <button type="button" class="suggestion-chip" data-prompt="Jelaskan perbedaan REST API dan GraphQL secara singkat.">
                        Jelaskan perbedaan REST API dan GraphQL
                    </button>
                    <button type="button" class="suggestion-chip" data-prompt="Buatkan contoh fungsi fetch POST di JavaScript beserta penanganan errornya.">
                        Contoh fungsi fetch POST di JavaScript
                    </button>
                    <button type="button" class="suggestion-chip" data-prompt="Berikan 5 tips menulis kode backend Node.js yang rapi dan mudah dirawat.">
                        Tips menulis kode Node.js yang rapi
                    </button>
                </div>
            </section>

            <div class="messages" id="messagesList"></div>
        </main>
        <footer class="composer-wrap">
            <form class="composer" id="chatForm">
                <label for="messageInput" class="sr-only">Tulis pesan</label>
                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Ketik pesan Anda... (Enter untuk kirim, Shift+Enter untuk baris baru)"
                    autocomplete="off"
                ></textarea>

                <div class="composer-actions">
                    <button
                        type="button"
                        class="btn-stop hidden"
                        id="stopBtn"
                        aria-label="Hentikan respons"
                        title="Hentikan respons"
                    >
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="6" width="12" height="12" rx="2" />
                        </svg>
                    </button>

                    <button
                        type="submit"
                        class="btn-send"
                        id="sendBtn"
                        aria-label="Kirim pesan"
                        title="Kirim pesan"
                        disabled
                    >
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m22 2-7 20-4-9-9-4Z" />
                            <path d="M22 2 11 13" />
                        </svg>
                    </button>
                </div>
            </form>
        </footer>
